<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAKE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
    user-select: none;
  }

  #header {
    display: flex;
    justify-content: space-between;
    width: 500px;
    max-width: 95vw;
    margin-bottom: 12px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .score-label { color: #444; }
  .score-val { color: #39ff14; font-size: 20px; font-weight: bold; text-shadow: 0 0 8px #39ff14aa; }
  .hi-val { color: #ff6b35; font-size: 20px; font-weight: bold; text-shadow: 0 0 8px #ff6b3588; }

  #wrap {
    position: relative;
    line-height: 0;
  }

  canvas {
    display: block;
    border: 1px solid #1a1a2e;
    box-shadow: 0 0 40px #39ff1420, 0 0 80px #39ff1408;
  }

  /* Overlay (start / game-over) */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(2px);
    gap: 18px;
    transition: opacity 0.2s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay h1 {
    font-size: clamp(36px, 8vw, 64px);
    letter-spacing: 12px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #39ff14, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 12px #39ff1460);
  }

  #overlay .subtitle {
    color: #555;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  #overlay .final-score {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #888;
  }
  #overlay .final-score span { color: #39ff14; font-size: 32px; display: block; text-align: center; margin-top: 4px; }

  #btn {
    margin-top: 8px;
    padding: 12px 40px;
    background: transparent;
    border: 1px solid #39ff14;
    color: #39ff14;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
  }
  #btn:hover {
    background: #39ff1418;
    box-shadow: 0 0 20px #39ff1440;
  }

  #controls {
    margin-top: 16px;
    color: #333;
    font-size: 11px;
    letter-spacing: 2px;
    text-align: center;
    line-height: 2;
    text-transform: uppercase;
  }

  /* Level badge */
  #level {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #333;
    text-transform: uppercase;
  }
  #level span { color: #00d4ff; }
</style>
</head>
<body>

<div id="header">
  <div>
    <div class="score-label">Score</div>
    <div class="score-val" id="score">0</div>
  </div>
  <div style="text-align:right">
    <div class="score-label">Best</div>
    <div class="hi-val" id="hiscore">0</div>
  </div>
</div>

<div id="wrap">
  <canvas id="c"></canvas>

  <div id="level">Level <span id="lvl">1</span></div>

  <div id="overlay">
    <h1>SNAKE</h1>
    <p class="subtitle">How long can you get?</p>
    <div id="result" style="display:none" class="final-score">
      Score<span id="final">0</span>
    </div>
    <button id="btn">Play</button>
    <div id="controls">
      Arrow keys / WASD &nbsp;·&nbsp; Swipe on mobile
    </div>
  </div>
</div>

<script>
const COLS = 25;
const ROWS = 25;
const CELL = Math.min(Math.floor(Math.min(window.innerWidth * 0.95, window.innerHeight * 0.72) / COLS), 20);
const W = COLS * CELL;
const H = ROWS * CELL;

const canvas = document.getElementById('c');
canvas.width  = W;
canvas.height = H;
const ctx = canvas.getContext('2d');

const $score  = document.getElementById('score');
const $hi     = document.getElementById('hiscore');
const $lvl    = document.getElementById('lvl');
const $overlay= document.getElementById('overlay');
const $result = document.getElementById('result');
const $final  = document.getElementById('final');
const $btn    = document.getElementById('btn');

let hi = +localStorage.getItem('snake_hi') || 0;
$hi.textContent = hi;

// ── game state ────────────────────────────────────────────────────────────
let snake, dir, nextDir, food, bonus, score, level, particles, running, loop;
let bonusTimer = 0, bonusDuration = 0;

function init() {
  const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
  snake = [{x: cx, y: cy}, {x: cx-1, y: cy}, {x: cx-2, y: cy}];
  dir     = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  food    = placeFood();
  bonus   = null;
  score   = 0;
  level   = 1;
  particles = [];
  bonusTimer = 0;
  updateHUD();
}

function placeFood(exclude = []) {
  const occupied = new Set([...snake, ...exclude].map(p => `${p.x},${p.y}`));
  let pos;
  do { pos = {x: rand(COLS), y: rand(ROWS)}; } while (occupied.has(`${pos.x},${pos.y}`));
  return pos;
}

function rand(n) { return Math.floor(Math.random() * n); }

// ── speed schedule ────────────────────────────────────────────────────────
function tickMs() {
  // starts at 140ms, drops to ~60ms at level 10
  return Math.max(60, 140 - (level - 1) * 9);
}

// ── game loop ─────────────────────────────────────────────────────────────
function startLoop() {
  clearTimeout(loop);
  if (!running) return;
  loop = setTimeout(() => { tick(); startLoop(); }, tickMs());
}

function tick() {
  dir = {...nextDir};

  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
  // self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);

  let ate = false;
  if (head.x === food.x && head.y === food.y) {
    score += 10 * level;
    ate = true;
    spawnParticles(food.x, food.y, '#39ff14', 10);
    food = placeFood(bonus ? [bonus] : []);
    level = Math.floor(score / 100) + 1;
    // maybe spawn bonus
    if (!bonus && Math.random() < 0.3) {
      bonus = placeFood([food]);
      bonusDuration = 6000;
      bonusTimer = Date.now();
    }
  } else if (bonus && head.x === bonus.x && head.y === bonus.y) {
    score += 50 * level;
    ate = true;
    spawnParticles(bonus.x, bonus.y, '#ff6b35', 18);
    bonus = null;
  }

  if (!ate) snake.pop();

  // bonus expiry
  if (bonus && Date.now() - bonusTimer > bonusDuration) bonus = null;

  updateHUD();
  draw();
}

function gameOver() {
  running = false;
  clearTimeout(loop);
  if (score > hi) { hi = score; localStorage.setItem('snake_hi', hi); $hi.textContent = hi; }
  $final.textContent = score;
  $result.style.display = 'block';
  $btn.textContent = 'Play again';
  $overlay.classList.remove('hidden');
  // death flash
  deathFlash();
}

function deathFlash() {
  let n = 0;
  const iv = setInterval(() => {
    draw(n % 2 === 0 ? '#ff003388' : null);
    if (++n >= 6) clearInterval(iv);
  }, 80);
}

function updateHUD() {
  $score.textContent = score;
  $lvl.textContent   = level;
}

// ── particles ─────────────────────────────────────────────────────────────
function spawnParticles(gx, gy, color, n) {
  const cx = gx * CELL + CELL/2, cy = gy * CELL + CELL/2;
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1, decay: 0.04 + Math.random() * 0.04,
      r: 2 + Math.random() * 2,
      color
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.08; // gravity
    p.life -= p.decay;
    return p.life > 0;
  });
}

// ── drawing ───────────────────────────────────────────────────────────────
function draw(flashColor) {
  // background
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  // subtle grid
  ctx.strokeStyle = '#111118';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, H); ctx.stroke(); }
  for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(W, y*CELL); ctx.stroke(); }

  // flash overlay
  if (flashColor) { ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); }

  // food
  drawFood(food.x, food.y, '#39ff14', '#1aff00');

  // bonus food
  if (bonus) {
    const age = (Date.now() - bonusTimer) / bonusDuration;
    const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 120);
    const alpha = age > 0.7 ? (1 - age) / 0.3 : 1;
    ctx.globalAlpha = alpha * pulse;
    drawFood(bonus.x, bonus.y, '#ff6b35', '#ffaa00', true);
    ctx.globalAlpha = 1;
  }

  // snake
  drawSnake();

  // particles
  updateParticles();
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFood(gx, gy, color, glow, star = false) {
  const cx = gx * CELL + CELL/2, cy = gy * CELL + CELL/2;
  const r  = CELL * 0.38;
  const pulse = 0.85 + 0.15 * Math.sin(Date.now() / 300);

  // glow
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.5 * pulse);
  g.addColorStop(0, color + 'cc');
  g.addColorStop(1, color + '00');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 2.5 * pulse, 0, Math.PI * 2);
  ctx.fill();

  // body
  ctx.fillStyle = color;
  ctx.shadowColor = glow;
  ctx.shadowBlur = 12;
  if (star) {
    drawStar(cx, cy, 5, r * pulse, r * 0.45 * pulse);
  } else {
    ctx.beginPath();
    ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawStar(cx, cy, spikes, outerR, innerR) {
  const step = Math.PI / spikes;
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = i * step - Math.PI / 2;
    i === 0 ? ctx.moveTo(cx + r*Math.cos(a), cy + r*Math.sin(a))
             : ctx.lineTo(cx + r*Math.cos(a), cy + r*Math.sin(a));
  }
  ctx.closePath();
  ctx.fill();
}

function drawSnake() {
  const len = snake.length;
  for (let i = len - 1; i >= 0; i--) {
    const {x, y} = snake[i];
    const t = i / (len - 1 || 1); // 0 = head, 1 = tail

    // color gradient: head is bright green → tail is dark green
    const r = Math.round(0   + t * 0);
    const g = Math.round(255 - t * 160);
    const b = Math.round(20  - t * 20);
    const color = `rgb(${r},${g},${b})`;

    const pad = i === 0 ? 1 : 2;
    const size = CELL - pad * 2;
    const radius = i === 0 ? 4 : 3;

    ctx.shadowColor = i === 0 ? '#39ff14' : '#22aa0060';
    ctx.shadowBlur  = i === 0 ? 14 : 4;
    ctx.fillStyle   = color;
    roundRect(ctx, x * CELL + pad, y * CELL + pad, size, size, radius);
    ctx.fill();

    // head eyes
    if (i === 0) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0a0a0f';
      const ex = x * CELL + CELL/2 + dir.x * 3;
      const ey = y * CELL + CELL/2 + dir.y * 3;
      const eox = dir.y * 3;
      const eoy = dir.x * 3;
      ctx.beginPath(); ctx.arc(ex + eox, ey - eoy, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex - eox, ey + eoy, 2, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.shadowBlur = 0;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ── input ─────────────────────────────────────────────────────────────────
const DIRS = {
  ArrowUp:    {x:0,y:-1}, w: {x:0,y:-1}, W: {x:0,y:-1},
  ArrowDown:  {x:0,y:1},  s: {x:0,y:1},  S: {x:0,y:1},
  ArrowLeft:  {x:-1,y:0}, a: {x:-1,y:0}, A: {x:-1,y:0},
  ArrowRight: {x:1,y:0},  d: {x:1,y:0},  D: {x:1,y:0},
};

document.addEventListener('keydown', e => {
  const d = DIRS[e.key];
  if (d) {
    e.preventDefault();
    // no 180-degree reversals
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    if (!running) startGame();
  }
  if ((e.key === ' ' || e.key === 'Enter') && !running) startGame();
});

// touch swipe
let touchX = 0, touchY = 0;
canvas.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
  let d;
  if (Math.abs(dx) > Math.abs(dy)) d = dx > 0 ? DIRS.ArrowRight : DIRS.ArrowLeft;
  else                              d = dy > 0 ? DIRS.ArrowDown  : DIRS.ArrowUp;
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  if (!running) startGame();
}, {passive:true});

$btn.addEventListener('click', startGame);

function startGame() {
  init();
  running = true;
  $overlay.classList.add('hidden');
  startLoop();
  draw();
}

// ── idle animation on the start screen ───────────────────────────────────
function idleLoop() {
  if (running) return;
  draw();
  requestAnimationFrame(idleLoop);
}

// draw a still preview
(function preview() {
  const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
  snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy},{x:cx-3,y:cy},{x:cx-4,y:cy}];
  dir = {x:1,y:0}; nextDir = dir;
  food = {x: cx+4, y: cy};
  bonus = {x: cx+4, y: cy-3}; bonusTimer = Date.now(); bonusDuration = 99999;
  particles = [];
  draw();
  requestAnimationFrame(idleLoop);
})();
</script>
</body>
</html>
