<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SNAKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --g:  #39ff14;
  --c:  #00d4ff;
  --o:  #ff6b35;
  --pk: #ff2a6d;
  --pu: #a855f7;
  --gd: #ffd700;
  --bg: #07071a;
  --f:  'Share Tech Mono','Courier New',monospace;
}

body{
  background:var(--bg);
  font-family:var(--f);
  color:#fff;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
  padding:6px;
  gap:6px;
}

/* scanlines */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,
    rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px
  );
}

/* ── shell ── */
#sh{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  gap:6px;width:100%;max-width:500px;
}

/* ── header ── */
#hdr{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;padding:0 2px;
}
#logo{
  font-size:clamp(18px,4.5vw,26px);letter-spacing:7px;text-transform:uppercase;
  background:linear-gradient(100deg,var(--g) 0%,var(--c) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 10px rgba(57,255,20,.45));
}
#lvl-wrap{
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
}
#lvl-lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#444;}
#lvl-val{font-size:17px;font-weight:bold;color:var(--c);text-shadow:0 0 8px var(--c);line-height:1;}

/* ── score row ── */
#srow{
  display:flex;gap:5px;width:100%;
}
.sbox{
  flex:1;background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);border-radius:7px;
  padding:7px 10px;display:flex;flex-direction:column;gap:1px;
  transition:border-color .3s,box-shadow .3s;
}
.sbox.flash{border-color:rgba(57,255,20,.4);box-shadow:0 0 16px rgba(57,255,20,.15);}
.slbl{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:#444;}
.sval{font-size:clamp(18px,4vw,24px);font-weight:bold;line-height:1;font-variant-numeric:tabular-nums;}
#sv-score{color:var(--g);text-shadow:0 0 10px rgba(57,255,20,.4);}
#sv-hi{color:var(--o);text-shadow:0 0 10px rgba(255,107,53,.4);}
#mid-box{align-items:center;justify-content:center;gap:4px;}
.lives{display:flex;gap:4px;align-items:center;}
.ld{
  width:9px;height:9px;border-radius:50%;
  background:var(--g);box-shadow:0 0 5px var(--g);
  transition:background .25s,box-shadow .25s,transform .25s;
}
.ld.gone{background:#1c1c30;box-shadow:none;transform:scale(.7);}
#xpbar{width:80px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
#xpfill{height:100%;background:linear-gradient(90deg,var(--g),var(--c));border-radius:2px;transition:width .4s ease;}
#dlbl{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#3a3a5a;}

/* ── canvas wrap ── */
#ww{position:relative;line-height:0;border-radius:7px;overflow:hidden;}
canvas{display:block;background:var(--bg);}
#ww.shake canvas{animation:sk .25s ease-in-out;}
@keyframes sk{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-5px,3px)}50%{transform:translate(4px,-3px)}80%{transform:translate(-2px,2px)}
}

/* ── pwr chips ── */
#pwrs{
  position:absolute;top:9px;left:9px;
  display:flex;flex-direction:column;gap:4px;pointer-events:none;
}
.pc{
  background:rgba(7,7,26,.9);border:1px solid;border-radius:4px;
  padding:4px 8px;font-size:9px;letter-spacing:2px;text-transform:uppercase;
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;
}
.pc .pb{width:40px;height:2px;background:rgba(255,255,255,.1);border-radius:1px;overflow:hidden;}
.pc .pb div{height:100%;border-radius:1px;transition:width .15s linear;}

/* ── toasts ── */
#toasts{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:3px;pointer-events:none;align-items:center;
}
.toast{
  background:rgba(7,7,26,.92);border:1px solid;
  padding:5px 12px;font-size:10px;letter-spacing:3px;text-transform:uppercase;
  backdrop-filter:blur(8px);text-shadow:0 0 5px currentColor;
  animation:tst 2.5s forwards;white-space:nowrap;
}
@keyframes tst{
  0%{opacity:0;transform:translateY(-8px) scale(.9)}
  12%{opacity:1;transform:translateY(0) scale(1)}
  80%{opacity:1}100%{opacity:0;transform:translateY(-5px)}
}

/* ── pause ── */
#pov{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:10px;
  background:rgba(0,0,0,.65);backdrop-filter:blur(5px);
}
#pov.on{display:flex;}
#pov .pt{font-size:clamp(22px,6vw,34px);letter-spacing:10px;color:var(--c);text-shadow:0 0 16px var(--c);text-transform:uppercase;}
#pov .ph{font-size:9px;letter-spacing:2px;color:#3a3a5a;text-transform:uppercase;}

/* ── main overlay ── */
#ov{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(7,7,26,.9);backdrop-filter:blur(6px);
  gap:10px;padding:20px;transition:opacity .3s;
}
#ov.off{opacity:0;pointer-events:none;}
#ov-title{
  font-size:clamp(40px,9vw,68px);letter-spacing:13px;text-transform:uppercase;
  background:linear-gradient(130deg,var(--g) 0%,var(--c) 55%,var(--pu) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 18px rgba(57,255,20,.4));
  line-height:1;margin-bottom:2px;
}
#ov-sub{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#555;min-height:14px;}

/* diff picker */
#dpick{display:flex;gap:5px;margin:2px 0;}
.db{
  padding:6px 16px;background:transparent;border:1px solid #252535;
  color:#555;font-family:var(--f);font-size:10px;letter-spacing:3px;text-transform:uppercase;
  cursor:pointer;border-radius:4px;transition:all .15s;
}
.db:hover{border-color:#454565;color:#888;}
.db.on{border-color:var(--c);color:var(--c);background:rgba(0,212,255,.07);box-shadow:0 0 12px rgba(0,212,255,.18);}
.db.on.easy{border-color:var(--g);color:var(--g);background:rgba(57,255,20,.06);box-shadow:0 0 12px rgba(57,255,20,.18);}
.db.on.hard{border-color:var(--pk);color:var(--pk);background:rgba(255,42,109,.06);box-shadow:0 0 12px rgba(255,42,109,.18);}

/* stats */
#sg{display:none;grid-template-columns:auto auto;gap:3px 24px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;}
#sg.on{display:grid;}
#sg .v{color:var(--g);font-weight:bold;text-align:right;font-size:12px;}
#sg .v.gold{color:var(--gd);}

/* play button */
.pbtn{
  margin-top:4px;padding:10px 40px;background:transparent;
  border:1px solid var(--g);color:var(--g);
  font-family:var(--f);font-size:12px;letter-spacing:5px;text-transform:uppercase;
  cursor:pointer;border-radius:4px;transition:all .15s;
  box-shadow:inset 0 0 0 0 rgba(57,255,20,0);
}
.pbtn:hover{background:rgba(57,255,20,.1);box-shadow:0 0 22px rgba(57,255,20,.28);}
.pbtn:active{transform:scale(.97);}

/* options */
#opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tog{
  padding:4px 12px;background:transparent;border:1px solid #252535;
  color:#555;font-family:var(--f);font-size:9px;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;border-radius:3px;transition:all .15s;
}
.tog.on{border-color:var(--c);color:var(--c);}
.tog:hover{border-color:#454565;color:#888;}
.tog.on:hover{background:rgba(0,212,255,.07);}

/* controls hint */
#hint{
  color:#2a2a40;font-size:8px;letter-spacing:2px;
  text-align:center;line-height:1.9;text-transform:uppercase;margin-top:2px;
}
#hint kbd{
  background:#11111f;border:1px solid #1e1e35;border-radius:2px;
  padding:1px 5px;color:#555;font-family:var(--f);font-size:7px;
}

/* ── footer ── */
#ft{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:16px;padding:0 2px;}
#combo{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--pk);text-shadow:0 0 8px var(--pk);opacity:0;transition:opacity .15s;}
#combo.on{opacity:1;}
#fstatus{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#333;}
</style>
</head>
<body>
<div id="sh">
  <div id="hdr">
    <div id="logo">Snake</div>
    <div id="lvl-wrap"><div id="lvl-lbl">Level</div><div id="lvl-val">1</div></div>
  </div>

  <div id="srow">
    <div class="sbox" id="sbox-l"><span class="slbl">Score</span><span class="sval" id="sv-score">0</span></div>
    <div class="sbox" id="mid-box">
      <div class="lives" id="ldots"></div>
      <div id="xpbar"><div id="xpfill" style="width:0%"></div></div>
      <div id="dlbl">NORMAL</div>
    </div>
    <div class="sbox" style="align-items:flex-end"><span class="slbl">Best</span><span class="sval" id="sv-hi">0</span></div>
  </div>

  <div id="ww">
    <canvas id="c"></canvas>
    <div id="pwrs"></div>
    <div id="toasts"></div>
    <div id="pov"><div class="pt">Paused</div><div class="ph">Space · P to resume</div></div>
    <div id="ov">
      <div id="ov-title">Snake</div>
      <div id="ov-sub">How long can you get?</div>
      <div id="dpick">
        <button class="db easy"   data-d="easy">Easy</button>
        <button class="db on"     data-d="normal">Normal</button>
        <button class="db hard"   data-d="hard">Hard</button>
      </div>
      <div id="sg">
        <div>Score</div>          <div class="v"      id="ss-score">0</div>
        <div>High score</div>     <div class="v gold" id="ss-hi">0</div>
        <div>Foods eaten</div>    <div class="v"      id="ss-food">0</div>
        <div>Longest</div>        <div class="v"      id="ss-len">0</div>
        <div>Time</div>           <div class="v"      id="ss-time">0s</div>
        <div>Best combo</div>     <div class="v"      id="ss-combo">0×</div>
      </div>
      <button class="pbtn" id="pbtn">Play</button>
      <div id="opts">
        <button class="tog on" id="tsound">🔊 Sound</button>
        <button class="tog"    id="twrap">↺ Wrap</button>
      </div>
      <div id="hint">
        <kbd>↑↓←→</kbd> / <kbd>WASD</kbd> move &nbsp;·&nbsp; <kbd>Space</kbd> pause &nbsp;·&nbsp; swipe on mobile
      </div>
    </div>
  </div>

  <div id="ft">
    <div id="combo">&nbsp;</div>
    <div id="fstatus"></div>
  </div>
</div>

<script>
'use strict';

// ── sizes ──────────────────────────────────────────────────────────────────
const COLS=25,ROWS=25;
const CELL=Math.min(Math.floor(Math.min(innerWidth*.97,innerHeight*.63)/COLS),21);
const W=COLS*CELL,H=ROWS*CELL;

const canvas=document.getElementById('c');
canvas.width=W;canvas.height=H;
const ctx=canvas.getContext('2d');

// ── refs ───────────────────────────────────────────────────────────────────
const $sv   =document.getElementById('sv-score');
const $hi   =document.getElementById('sv-hi');
const $lvl  =document.getElementById('lvl-val');
const $ldots=document.getElementById('ldots');
const $dlbl =document.getElementById('dlbl');
const $xp   =document.getElementById('xpfill');
const $combo=document.getElementById('combo');
const $fst  =document.getElementById('fstatus');
const $ov   =document.getElementById('ov');
const $sub  =document.getElementById('ov-sub');
const $sg   =document.getElementById('sg');
const $pbtn =document.getElementById('pbtn');
const $pov  =document.getElementById('pov');
const $pwrs =document.getElementById('pwrs');
const $tsts =document.getElementById('toasts');
const $ww   =document.getElementById('ww');
const $sbL  =document.getElementById('sbox-l');

// ── difficulty ─────────────────────────────────────────────────────────────
const DIFFS={
  easy:  {name:'EASY',  lives:5,mult:1.65,base:145},
  normal:{name:'NORMAL',lives:3,mult:1.0, base:145},
  hard:  {name:'HARD',  lives:1,mult:0.62,base:145},
};
let diff='normal';

document.querySelectorAll('.db').forEach(b=>{
  b.addEventListener('click',()=>{
    diff=b.dataset.d;
    document.querySelectorAll('.db').forEach(x=>x.classList.toggle('on',x.dataset.d===diff));
    sfx.pip(440,.05);
  });
});

// ── settings ───────────────────────────────────────────────────────────────
const SET={
  sound:localStorage.getItem('snk_snd')!=='0',
  wrap: localStorage.getItem('snk_wrp')==='1',
};
let hi=+localStorage.getItem('snk_hi')||0;
$hi.textContent=hi;
syncSet();

function syncSet(){
  document.getElementById('tsound').classList.toggle('on',SET.sound);
  document.getElementById('tsound').textContent=(SET.sound?'🔊':'🔇')+' Sound';
  document.getElementById('twrap').classList.toggle('on',SET.wrap);
}
document.getElementById('tsound').addEventListener('click',()=>{
  SET.sound=!SET.sound;localStorage.setItem('snk_snd',SET.sound?'1':'0');syncSet();
  if(SET.sound)sfx.pip(660,.05);
});
document.getElementById('twrap').addEventListener('click',()=>{
  SET.wrap=!SET.wrap;localStorage.setItem('snk_wrp',SET.wrap?'1':'0');syncSet();sfx.pip(440,.05);
});

// ── audio ──────────────────────────────────────────────────────────────────
const sfx=(()=>{
  let ac=null;
  const gc=()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;};
  const t=(f,d,tp='square',v=.10,a=.006,r=.05)=>{
    if(!SET.sound)return;const x=gc(),t0=x.currentTime;
    const o=x.createOscillator(),g=x.createGain();
    o.type=tp;o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+a);g.gain.linearRampToValueAtTime(0,t0+d+r);
    o.connect(g).connect(x.destination);o.start(t0);o.stop(t0+d+r+.02);
  };
  return{
    pip:     (f=880,d=.04)=>t(f,d,'square',.08),
    eat:     ()=>{t(700,.05,'square',.11);setTimeout(()=>t(950,.06,'square',.08),35);},
    bonus:   ()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>t(f,.08,'triangle',.09),i*50)),
    powerup: ()=>[400,600,800,1000,1200].forEach((f,i)=>setTimeout(()=>t(f,.06,'sine',.08),i*40)),
    levelup: ()=>[440,554,659,880].forEach((f,i)=>setTimeout(()=>t(f,.1,'triangle',.11),i*70)),
    death:   ()=>{
      if(!SET.sound)return;const x=gc(),t0=x.currentTime;
      const o=x.createOscillator(),g=x.createGain();
      o.type='sawtooth';o.frequency.setValueAtTime(400,t0);
      o.frequency.exponentialRampToValueAtTime(70,t0+.65);
      g.gain.setValueAtTime(.13,t0);g.gain.linearRampToValueAtTime(0,t0+.7);
      o.connect(g).connect(x.destination);o.start(t0);o.stop(t0+.75);
    },
    combo:   n=>t(660+n*55,.05,'square',.08),
    pause:   ()=>t(330,.06,'sine',.07),
    unpause: ()=>t(550,.06,'sine',.07),
    respawn: ()=>[300,500,700].forEach((f,i)=>setTimeout(()=>t(f,.08,'sine',.07),i*65)),
    tick:    i=>t(280+i*150,.07,'square',.07),
    jackpot: ()=>[523,659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>t(f,.12,'triangle',.11),i*55)),
    slotWin: ()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>t(f,.10,'triangle',.10),i*65)),
    slotBust:()=>[380,300,220,130].forEach((f,i)=>setTimeout(()=>t(f,.14,'sawtooth',.08),i*110)),
  };
})();

// ── state machine ──────────────────────────────────────────────────────────
const S={MENU:0,PLAYING:1,PAUSED:2,OVER:3,GAMBLING:4,RESPAWN:5};
let state=S.MENU;

// game vars
let snake,prev,dir,ndir;
let food,bonus,pup,coin;         // items on board
let score,dScore,level,ate,lives;
let bonusT,bonusD,pupT,pupD,coinT;
let aPow,aPowEnd;
let combo,comboT,bestCombo,longest;
let tStart,lastAt,pend=0;
let parts=[],pops=[],ripples=[];  // vfx
let slotSt=null;
let respT=0;
let lvlAnim=null;                 // level-up banner {at,lvl}

// menu snake
let mS=[],mD={x:1,y:0},mF={x:20,y:12},mT=0,mTms=120;

const POWERS={
  slow: {name:'SLOW-MO',color:'#a855f7',dur:6000,sym:'◐'},
  ghost:{name:'GHOST',  color:'#00d4ff',dur:6000,sym:'◯'},
  mag:  {name:'MAGNET', color:'#ff2a6d',dur:6000,sym:'✦'},
};
const SSYM =['7','$','♦','★','♣','!'];
const SCOL =['#ffd700','#39ff14','#00d4ff','#ff6b35','#a855f7','#ff2a6d'];

// ── init ───────────────────────────────────────────────────────────────────
function init(){
  const d=DIFFS[diff];
  const cx=~~(COLS/2),cy=~~(ROWS/2);
  snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  prev=snake.map(s=>({...s}));
  dir={x:1,y:0};ndir={x:1,y:0};
  food=place();bonus=null;pup=null;coin=null;
  score=0;dScore=0;level=1;ate=0;longest=3;
  combo=0;comboT=0;bestCombo=0;
  lives=d.lives;
  parts=[];pops=[];ripples=[];slotSt=null;respT=0;lvlAnim=null;
  aPow=null;aPowEnd=0;
  tStart=Date.now();lastAt=performance.now();pend=0;
  buildLives();$dlbl.textContent=d.name;
  hud();refresh();
}

const rnd=n=>~~(Math.random()*n);
function place(ex=[]){
  const s=new Set([...snake,...ex].map(p=>`${p.x},${p.y}`));
  let p,t=0;do{p={x:rnd(COLS),y:rnd(ROWS)};if(++t>600)return null;}while(s.has(`${p.x},${p.y}`));
  return p;
}

function buildLives(){
  $ldots.innerHTML='';
  for(let i=0;i<DIFFS[diff].lives;i++){
    const d=document.createElement('div');
    d.className='ld'+(i>=lives?' gone':'');
    $ldots.appendChild(d);
  }
}
function syncLives(){
  $ldots.querySelectorAll('.ld').forEach((d,i)=>d.classList.toggle('gone',i>=lives));
}
function hud(){
  $lvl.textContent=level;
  $xp.style.width=(score%100)+'%';
}

// ── tick speed ─────────────────────────────────────────────────────────────
function ms(){
  const d=DIFFS[diff];
  const base=Math.max(48,(d.base-(level-1)*7)*d.mult);
  return aPow==='slow'?base*1.8:base;
}

// ── main loop ──────────────────────────────────────────────────────────────
;(function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(now-lastAt,100);lastAt=now;

  if(state===S.PLAYING){
    pend+=dt;const iv=ms();
    while(pend>=iv){tick();pend-=iv;if(state!==S.PLAYING)break;}
    if(aPow&&Date.now()>=aPowEnd){aPow=null;refresh();}
    refresh();
    if(combo>0&&Date.now()>comboT){combo=0;$combo.classList.remove('on');}
  }

  // smooth score
  if(state===S.PLAYING||state===S.OVER||state===S.GAMBLING){
    const d=score-dScore;
    if(Math.abs(d)>0){
      dScore+=Math.sign(d)*Math.max(1,~~(Math.abs(d)*.18));
      if(Math.abs(score-dScore)<2)dScore=score;
      $sv.textContent=dScore;
    }
  }

  // respawn
  if(state===S.RESPAWN){
    respT-=dt;
    if(respT<=0)doRespawn();
  }

  // slot
  if(slotSt){
    const n=Date.now();
    for(let i=0;i<3;i++)if(n<slotSt.st[i])slotSt.sp[i]+=dt*.022;
    if(!slotSt.rAt&&n>slotSt.st[2]+350)resolveSlot();
    if(slotSt.rAt&&n>slotSt.rAt+2800)applySlot();
  }

  // menu snake
  if(state===S.MENU){mT+=dt;while(mT>=mTms){mT-=mTms;stepMenu();}}

  // level-up banner decay
  if(lvlAnim&&Date.now()-lvlAnim.at>1800)lvlAnim=null;

  draw();
})(0);

// ── game tick ──────────────────────────────────────────────────────────────
function tick(){
  dir={...ndir};
  prev=snake.map(s=>({...s}));

  let nx=snake[0].x+dir.x,ny=snake[0].y+dir.y;
  if(SET.wrap){nx=(nx+COLS)%COLS;ny=(ny+ROWS)%ROWS;}
  else if(nx<0||nx>=COLS||ny<0||ny>=ROWS)return die();

  const h={x:nx,y:ny};
  if(snake.some((s,i)=>i!==snake.length-1&&s.x===h.x&&s.y===h.y)&&aPow!=='ghost')return die();

  snake.unshift(h);
  let grew=false;

  // food
  if(food&&h.x===food.x&&h.y===food.y){
    grew=true;ate++;
    bump();
    const pts=10*level*Math.max(1,combo);score+=pts;
    popAt(`+${pts}`,food.x,food.y,'#39ff14');
    spark(food.x,food.y,'#39ff14',12);
    ripple(food.x*CELL+CELL/2,food.y*CELL+CELL/2,'#39ff14');
    sfx.eat();
    food=place([bonus,pup,coin].filter(Boolean));

    if(!bonus&&ate%4===0&&Math.random()<.7){
      bonus=place([food,pup,coin].filter(Boolean));bonusT=Date.now();bonusD=7000;
    }
    if(!pup&&ate>4&&ate%6===0&&Math.random()<.55){
      const ks=Object.keys(POWERS),tp=ks[rnd(ks.length)];
      pup={...place([food,bonus,coin].filter(Boolean)),tp};
      if(pup.x==null)pup=null;else{pupT=Date.now();pupD=9000;}
    }
    if(!coin&&ate>2&&ate%8===0&&Math.random()<.5){
      const p=place([food,bonus,pup].filter(Boolean));
      if(p){coin=p;coinT=Date.now();}
    }

    const nl=~~(score/100)+1;
    if(nl>level){
      level=nl;
      if(level<=12)sfx.levelup();
      lvlAnim={at:Date.now(),lvl:level};
      if(level===5) showToast('SPEED UP','#00d4ff');
      if(level===10)showToast('MAX SPEED','#ff2a6d');
    }
    if(ate===1)  showToast('FIRST BLOOD','#39ff14');
    if(ate===25) showToast('25 FOODS','#39ff14');
    if(ate===50) showToast('50 FOODS','#ff6b35');
    if(ate===100)showToast('CENTURY','#a855f7');
  }
  else if(bonus&&h.x===bonus.x&&h.y===bonus.y){
    grew=true;bump();
    const pts=50*level*Math.max(1,combo);score+=pts;
    popAt(`+${pts}`,bonus.x,bonus.y,'#ff6b35');
    spark(bonus.x,bonus.y,'#ff6b35',24);
    ripple(bonus.x*CELL+CELL/2,bonus.y*CELL+CELL/2,'#ff6b35');
    sfx.bonus();shake();bonus=null;
  }
  else if(pup&&h.x===pup.x&&h.y===pup.y){
    const def=POWERS[pup.tp];
    aPow=pup.tp;aPowEnd=Date.now()+def.dur;
    popAt(def.name,pup.x,pup.y,def.color);
    spark(pup.x,pup.y,def.color,30);
    ripple(pup.x*CELL+CELL/2,pup.y*CELL+CELL/2,def.color);
    sfx.powerup();shake();showToast(def.name+' ACTIVE',def.color);pup=null;
  }
  else if(coin&&h.x===coin.x&&h.y===coin.y){
    grew=true;spark(coin.x,coin.y,'#ffd700',36,true);
    ripple(coin.x*CELL+CELL/2,coin.y*CELL+CELL/2,'#ffd700');
    shake();coin=null;startSlot();return;
  }

  if(!grew)snake.pop();
  longest=Math.max(longest,snake.length);

  if(aPow==='mag'){
    for(const it of[food,bonus,pup]){
      if(!it)continue;
      const dx=snake[0].x-it.x,dy=snake[0].y-it.y;
      if(Math.abs(dx)+Math.abs(dy)>1){if(Math.abs(dx)>Math.abs(dy))it.x+=Math.sign(dx);else it.y+=Math.sign(dy);}
    }
  }

  if(bonus&&Date.now()-bonusT>bonusD)bonus=null;
  if(pup&&Date.now()-pupT>pupD)pup=null;
  if(coin&&Date.now()-coinT>10000)coin=null;
  hud();
}

// ── death / respawn ────────────────────────────────────────────────────────
function die(){
  lives--;syncLives();
  sfx.death();shake();
  for(const s of snake)spark(s.x,s.y,'#ff2a6d',4,true);
  snake=[];
  if(lives<=0){gameOver();return;}
  state=S.RESPAWN;respT=2200;$fst.textContent='';
}
function doRespawn(){
  const cx=~~(COLS/2),cy=~~(ROWS/2);
  snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  prev=snake.map(s=>({...s}));
  dir={x:1,y:0};ndir={x:1,y:0};
  aPow=null;aPowEnd=0;combo=0;$combo.classList.remove('on');
  sfx.respawn();state=S.PLAYING;lastAt=performance.now();pend=0;$fst.textContent='';
}
function gameOver(){
  state=S.OVER;
  if(score>hi){hi=score;localStorage.setItem('snk_hi',hi);$hi.textContent=hi;}
  setTimeout(showOver,750);
}
function showOver(){
  document.getElementById('ss-score').textContent=score;
  document.getElementById('ss-hi').textContent=hi;
  document.getElementById('ss-food').textContent=ate;
  document.getElementById('ss-len').textContent=longest;
  document.getElementById('ss-time').textContent=ft((Date.now()-tStart)/1000);
  document.getElementById('ss-combo').textContent=bestCombo+'×';
  $sg.classList.add('on');
  $sub.textContent=score===hi&&hi>0?'✦ NEW HIGH SCORE ✦':'Game Over';
  $pbtn.textContent='Play Again';
  $ov.classList.remove('off');
}
const ft=s=>{s=~~s;const m=~~(s/60),r=s%60;return m?`${m}m ${r}s`:`${r}s`;};

// ── combo ──────────────────────────────────────────────────────────────────
function bump(){
  combo=Date.now()<comboT?Math.min(combo+1,10):1;
  comboT=Date.now()+2500;bestCombo=Math.max(bestCombo,combo);
  if(combo>=2){sfx.combo(combo);$combo.textContent=`${combo}× COMBO`;$combo.classList.add('on');}
}

// ── slot ───────────────────────────────────────────────────────────────────
function startSlot(){
  const n=Date.now(),f=[rnd(6),rnd(6),rnd(6)];
  slotSt={f,sp:[0,0,0],st:[n+750,n+1280,n+1820],rAt:0,res:null,pre:score};
  state=S.GAMBLING;sfx.pip(880,.04);
}
function resolveSlot(){
  const f=slotSt.f;
  for(let i=0;i<3;i++)sfx.tick(i);
  const r=f[0]===f[1]&&f[1]===f[2]?'jackpot':(f[0]===f[1]||f[1]===f[2]||f[0]===f[2]?'win':'bust');
  slotSt.res=r;slotSt.rAt=Date.now();
  if(r==='jackpot')sfx.jackpot();else if(r==='win')sfx.slotWin();else sfx.slotBust();
}
function applySlot(){
  const r=slotSt.res,pre=slotSt.pre,mid={x:~~(COLS/2),y:~~(ROWS/2)};
  if(r==='jackpot'){score=pre*3;showToast('JACKPOT! ×3','#ffd700');popAt('×3',mid.x,mid.y,'#ffd700');shake();}
  else if(r==='win'){score=pre*2;showToast('WINNER! ×2','#39ff14');popAt('×2',mid.x,mid.y,'#39ff14');}
  else{score=Math.max(0,~~(pre/2));showToast('BUSTED! ÷2','#ff2a6d');popAt('÷2',mid.x,mid.y,'#ff2a6d');}
  hud();slotSt=null;state=S.PLAYING;lastAt=performance.now();pend=0;
}

// ── vfx ────────────────────────────────────────────────────────────────────
function spark(gx,gy,col,n,big=false){
  const cx=gx*CELL+CELL/2,cy=gy*CELL+CELL/2;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=(big?2:1)+Math.random()*(big?5:3);
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(big?.5:0),
      life:1,dc:.03+Math.random()*.04,r:1.5+Math.random()*(big?3:2),col});
  }
}
function ripple(cx,cy,col){
  ripples.push({cx,cy,r:CELL*.3,col,life:1,dc:.032});
}
function popAt(txt,gx,gy,col){
  pops.push({txt,col,x:gx*CELL+CELL/2,y:gy*CELL+CELL/2,life:1,dc:.016});
}
function showToast(txt,col='#39ff14'){
  const e=document.createElement('div');
  e.className='toast';e.style.color=col;e.style.borderColor=col;e.textContent=txt;
  $tsts.appendChild(e);setTimeout(()=>e.remove(),2500);
}
function shake(){$ww.classList.remove('shake');void $ww.offsetWidth;$ww.classList.add('shake');}
function refresh(){
  if(!aPow){$pwrs.innerHTML='';return;}
  const def=POWERS[aPow],rem=Math.max(0,aPowEnd-Date.now()),pct=(rem/def.dur)*100;
  if(!$pwrs.firstChild){
    $pwrs.innerHTML=`<div class="pc" style="border-color:${def.color};color:${def.color}">
      <span>${def.sym} ${def.name}</span>
      <div class="pb"><div style="width:${pct}%;background:${def.color}"></div></div></div>`;
  }else{const b=$pwrs.querySelector('.pb>div');if(b)b.style.width=pct+'%';}
}

// ── score box flash ────────────────────────────────────────────────────────
let _lastScore=0;
function checkFlash(){
  if(score>_lastScore){_lastScore=score;$sbL.classList.add('flash');setTimeout(()=>$sbL.classList.remove('flash'),400);}
}

// ── menu snake ─────────────────────────────────────────────────────────────
function initMenu(){
  const cx=~~(COLS/2),cy=~~(ROWS/2);
  mS=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy},{x:cx-3,y:cy},{x:cx-4,y:cy}];
  mD={x:1,y:0};mF={x:cx+7,y:cy};mT=0;
}
function stepMenu(){
  const h=mS[0];
  const toF={x:Math.sign(mF.x-h.x),y:Math.sign(mF.y-h.y)};
  const cands=[];
  if(toF.x!==0)cands.push({x:toF.x,y:0});
  if(toF.y!==0)cands.push({x:0,y:toF.y});
  cands.push({x:mD.y,y:mD.x},{x:-mD.y,y:-mD.x},mD);
  let ch=mD;
  for(const d of cands){
    if(d.x===-mD.x&&d.y===-mD.y)continue;
    const nx=h.x+d.x,ny=h.y+d.y;
    if(nx<0||nx>=COLS||ny<0||ny>=ROWS)continue;
    if(mS.slice(0,-1).some(s=>s.x===nx&&s.y===ny))continue;
    ch=d;break;
  }
  mD=ch;
  const nh={x:h.x+mD.x,y:h.y+mD.y};
  if(nh.x<0||nh.x>=COLS||nh.y<0||nh.y>=ROWS){initMenu();return;}
  mS.unshift(nh);
  if(nh.x===mF.x&&nh.y===mF.y){
    const occ=new Set(mS.map(s=>`${s.x},${s.y}`));
    let p,t=0;do{p={x:rnd(COLS),y:rnd(ROWS)};t++;}while(occ.has(`${p.x},${p.y}`)&&t<300);
    mF=p;
  }else{mS.pop();}
}

// ── draw ───────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle='#07071a';ctx.fillRect(0,0,W,H);

  // dot grid
  ctx.fillStyle='rgba(255,255,255,.016)';
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){ctx.beginPath();ctx.arc(x*CELL+CELL/2,y*CELL+CELL/2,.9,0,Math.PI*2);ctx.fill();}

  // items
  if(food)         dFood(food.x,food.y,'#39ff14');
  if(bonus)        dBonus();
  if(pup)          dPup();
  if(coin)         dCoin();

  // snake
  if(state===S.MENU){
    drawTube(mS,mD,null);
    dFood(mF.x,mF.y,'rgba(57,255,20,0.45)');
  }else if(state===S.PLAYING||state===S.GAMBLING||state===S.PAUSED){
    drawInterp();
  }else if(snake&&snake.length){
    drawTube(snake,dir,aPow);
  }

  // ripples
  ripples=ripples.filter(rp=>{
    rp.r+=CELL*.14;rp.life-=rp.dc;
    if(rp.life<=0)return false;
    ctx.globalAlpha=rp.life*.65;ctx.strokeStyle=rp.col;
    ctx.shadowColor=rp.col;ctx.shadowBlur=8;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(rp.cx,rp.cy,rp.r,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    return true;
  });

  // particles
  parts=parts.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=p.dc;
    if(p.life<=0)return false;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=5;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    return true;
  });

  // popups
  pops=pops.filter(p=>{
    p.y-=.65;p.life-=p.dc;
    if(p.life<=0)return false;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=7;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`bold ${~~(CELL*.72)}px Share Tech Mono,Courier New`;
    ctx.fillText(p.txt,p.x,p.y);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    return true;
  });

  // power border pulse
  if(aPow){
    const def=POWERS[aPow];
    ctx.strokeStyle=def.color;ctx.lineWidth=3;
    ctx.globalAlpha=.18+.12*Math.sin(Date.now()/180);
    ctx.strokeRect(1.5,1.5,W-3,H-3);ctx.globalAlpha=1;
  }

  // respawn overlay
  if(state===S.RESPAWN){
    ctx.fillStyle='rgba(7,7,26,0.5)';ctx.fillRect(0,0,W,H);
    const secs=Math.ceil(respT/1000);
    const pulse=.9+.1*Math.sin(Date.now()/120);
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(pulse,pulse);
    ctx.fillStyle='#ff2a6d';ctx.shadowColor='#ff2a6d';ctx.shadowBlur=40;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`bold ${~~(CELL*3.2)}px Share Tech Mono,Courier New`;
    ctx.fillText(secs,0,0);ctx.shadowBlur=0;ctx.restore();
    ctx.fillStyle='rgba(255,42,109,.55)';
    ctx.font=`${~~(CELL*.5)}px Share Tech Mono,Courier New`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(`${lives} LIFE${lives!==1?'S':''} LEFT`,W/2,H/2+CELL*2.4);
    checkFlash();
  }

  // level-up banner
  if(lvlAnim){
    const age=Date.now()-lvlAnim.at,dur=1800;
    const t=age/dur;
    let yOff=H/2;
    if(t<.18)yOff=H/2+(1-(t/.18))*H*.4;
    else if(t>.80)yOff=H/2+((t-.80)/.20)*H*.4;
    const alpha=t<.18?t/.18:(t>.80?(1-t)/.20:1);
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(7,7,26,0.78)';
    ctx.fillRect(0,yOff-CELL*1.4,W,CELL*2.8);
    ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=22;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`bold ${~~(CELL*.88)}px Share Tech Mono,Courier New`;
    ctx.fillText(`LEVEL  ${lvlAnim.lvl}`,W/2,yOff);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }

  // rainbow border
  dBorder();

  // gambling overlay on top
  if(slotSt)dSlot();
}

// ── bezier snake ───────────────────────────────────────────────────────────
function drawInterp(){
  if(!snake.length)return;
  const t=Math.min(1,pend/ms());
  const pos=snake.map((s,i)=>{
    const p=prev[i]||prev[prev.length-1]||s;
    let px=p.x,py=p.y;
    if(Math.abs(s.x-px)>1)px=s.x;if(Math.abs(s.y-py)>1)py=s.y;
    return{x:px+(s.x-px)*t,y:py+(s.y-py)*t};
  });
  drawTube(pos,dir,aPow);
}

function drawTube(pos,hd,pw){
  if(!pos.length)return;
  const ghost=pw==='ghost';
  const sw=CELL*.76;
  const isJump=(a,b)=>Math.abs(a.x-b.x)>1||Math.abs(a.y-b.y)>1;
  const cc=p=>({x:p.x*CELL+CELL/2,y:p.y*CELL+CELL/2});

  // split at wrap-around gaps
  const segs=[[]];
  for(let i=0;i<pos.length;i++){
    const last=segs[segs.length-1];
    if(last.length&&isJump(last[last.length-1],pos[i]))segs.push([]);
    segs[segs.length-1].push(pos[i]);
  }

  ctx.save();
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.shadowBlur=0; // no shadowBlur on paths — causes flicker on complex curves

  for(const seg of segs){
    if(seg.length<1)continue;
    const pts=seg.map(cc);
    const n=pts.length;

    // smooth bezier path through segment midpoints
    const buildPath=()=>{
      ctx.beginPath();
      ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=0;i<n-1;i++){
        const mx=(pts[i].x+pts[i+1].x)*.5, my=(pts[i].y+pts[i+1].y)*.5;
        ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
      }
      ctx.lineTo(pts[n-1].x,pts[n-1].y);
    };

    // Pass 1 — wide ambient glow (no shadowBlur needed, just wide+transparent)
    ctx.lineWidth=sw+14;
    ctx.strokeStyle=ghost?'rgba(0,212,255,.07)':'rgba(57,255,20,.08)';
    buildPath();ctx.stroke();

    // Pass 2 — mid glow
    ctx.lineWidth=sw+5;
    ctx.strokeStyle=ghost?'rgba(0,190,255,.11)':'rgba(57,255,20,.13)';
    buildPath();ctx.stroke();

    // Pass 3 — solid body (NO gradient — gradient direction jumps on turns)
    ctx.lineWidth=sw;
    ctx.strokeStyle=ghost?'rgba(0,168,255,.78)':'#39ff14';
    buildPath();ctx.stroke();

    // Pass 4 — inner highlight ridge
    ctx.lineWidth=sw*.34;
    ctx.strokeStyle=ghost?'rgba(175,235,255,.22)':'rgba(195,255,105,.22)';
    buildPath();ctx.stroke();

    // Tail fade — cover last 30% with bg-colour circles at rising opacity.
    // Circles are simple arcs: no path rebuild, no flicker.
    const tailLen=Math.max(0,~~(n*.30));
    const tStart=n-tailLen;
    for(let i=tStart;i<n;i++){
      const t=tailLen>1?(i-tStart)/(tailLen-1):1; // 0→body end, 1→tip
      ctx.globalAlpha=t*.90;
      ctx.fillStyle='#07071a';
      ctx.beginPath();
      ctx.arc(pts[i].x,pts[i].y,sw*.52,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // Head cap — a single circle is safe with shadowBlur
  if(pos.length>0){
    const h=cc(pos[0]),r=sw*.50;
    ctx.save();
    ctx.shadowColor=ghost?'#00d4ff':'#39ff14';
    ctx.shadowBlur=16;
    ctx.fillStyle=ghost?'#00b4ef':'#3dff16';
    ctx.beginPath();ctx.arc(h.x,h.y,r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // shine
    ctx.fillStyle=ghost?'rgba(200,245,255,.30)':'rgba(185,255,85,.28)';
    ctx.beginPath();ctx.arc(h.x-r*.20,h.y-r*.20,r*.52,0,Math.PI*2);ctx.fill();
    // eyes
    const ex=h.x+hd.x*r*.50,ey=h.y+hd.y*r*.50;
    const ox=hd.y*r*.35,oy=hd.x*r*.35;
    ctx.fillStyle='#05050e';
    ctx.beginPath();ctx.arc(ex+ox,ey-oy,r*.25,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(ex-ox,ey+oy,r*.25,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=ghost?'#00d4ff':'#aaff44';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=4;
    ctx.beginPath();ctx.arc(ex+ox,ey-oy,r*.10,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(ex-ox,ey+oy,r*.10,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  }
}

// ── item drawers ───────────────────────────────────────────────────────────
function dFood(gx,gy,col){
  const cx=gx*CELL+CELL/2,cy=gy*CELL+CELL/2,r=CELL*.32;
  const t=Date.now();const pulse=.86+.14*Math.sin(t/280);
  // glow halo
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*3.2);
  g.addColorStop(0,col.includes('rgba')?col:col+'70');g.addColorStop(1,col.includes('rgba')?'rgba(0,0,0,0)':col+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*3.2,0,Math.PI*2);ctx.fill();
  // orbiting dots
  const ang=t/750,orb=r*1.75;
  ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=9;
  ctx.beginPath();ctx.arc(cx+Math.cos(ang)*orb,cy+Math.sin(ang)*orb,r*.28,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(cx+Math.cos(ang+Math.PI)*orb,cy+Math.sin(ang+Math.PI)*orb,r*.18,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  // core
  ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(cx,cy,r*pulse,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  // shine
  ctx.fillStyle='rgba(255,255,255,.48)';ctx.beginPath();ctx.arc(cx-r*.28,cy-r*.28,r*.3,0,Math.PI*2);ctx.fill();
}

function dBonus(){
  const age=(Date.now()-bonusT)/bonusD;
  const a=(age>.70?(1-age)/.30:1)*(.78+.22*Math.sin(Date.now()/105));
  ctx.globalAlpha=a;
  const cx=bonus.x*CELL+CELL/2,cy=bonus.y*CELL+CELL/2,r=CELL*.36;
  const p=.86+.14*Math.sin(Date.now()/165);
  ctx.fillStyle='#ff6b35';ctx.shadowColor='#ff6b35';ctx.shadowBlur=20;
  star5(cx,cy,r*p,r*.42*p);ctx.shadowBlur=0;ctx.globalAlpha=1;
}

function dPup(){
  const def=POWERS[pup.tp];
  const age=(Date.now()-pupT)/pupD,alpha=age>.75?(1-age)/.25:1;
  ctx.globalAlpha=alpha;
  const cx=pup.x*CELL+CELL/2,cy=pup.y*CELL+CELL/2,r=CELL*.38;
  const rot=Date.now()/540;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  const g=ctx.createRadialGradient(0,0,0,0,0,r*2.3);
  g.addColorStop(0,def.color+'88');g.addColorStop(1,def.color+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*2.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=def.color;ctx.shadowColor=def.color;ctx.shadowBlur=16;
  ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.68,0);ctx.lineTo(0,r);ctx.lineTo(-r*.68,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.shadowBlur=0;
  ctx.font=`bold ${~~(CELL*.44)}px Share Tech Mono,Courier New`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.rotate(-rot);ctx.fillText(def.sym,0,1);
  ctx.restore();ctx.globalAlpha=1;
}

function dCoin(){
  const age=(Date.now()-coinT)/10000,alpha=age>.75?(1-age)/.25:1;
  ctx.globalAlpha=alpha;
  const cx=coin.x*CELL+CELL/2,cy=coin.y*CELL+CELL/2,r=CELL*.36;
  const pulse=.87+.13*Math.sin(Date.now()/190);
  // halo
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*3);
  g.addColorStop(0,'rgba(255,215,0,.40)');g.addColorStop(1,'rgba(255,215,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*3,0,Math.PI*2);ctx.fill();
  // coin
  ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=18;
  ctx.beginPath();ctx.arc(cx,cy,r*pulse,0,Math.PI*2);ctx.fill();
  // ring
  ctx.strokeStyle='rgba(180,140,0,.65)';ctx.lineWidth=1.5;ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(cx,cy,r*pulse*.70,0,Math.PI*2);ctx.stroke();
  // symbol
  ctx.fillStyle='#7a5300';ctx.font=`bold ${~~(CELL*.42)}px Share Tech Mono,Courier New`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',cx,cy+1);
  ctx.globalAlpha=1;
}

function star5(cx,cy,outerR,innerR){
  const s=Math.PI/5;ctx.beginPath();
  for(let i=0;i<10;i++){
    const r2=i%2===0?outerR:innerR,a=i*s-Math.PI/2;
    i===0?ctx.moveTo(cx+r2*Math.cos(a),cy+r2*Math.sin(a)):ctx.lineTo(cx+r2*Math.cos(a),cy+r2*Math.sin(a));
  }
  ctx.closePath();ctx.fill();
}

// ── rainbow border ─────────────────────────────────────────────────────────
function dBorder(){
  const h=(Date.now()/22)%360;
  const edges=[{x1:0,y1:0,x2:W,y2:0},{x1:W,y1:0,x2:W,y2:H},{x1:W,y1:H,x2:0,y2:H},{x1:0,y1:H,x2:0,y2:0}];
  ctx.save();ctx.lineWidth=4;ctx.lineCap='square';
  edges.forEach((e,i)=>{
    const h0=(h+i*90)%360,h1=(h+i*90+90)%360;
    const g=ctx.createLinearGradient(e.x1,e.y1,e.x2,e.y2);
    g.addColorStop(0,`hsl(${h0},100%,62%)`);g.addColorStop(1,`hsl(${h1},100%,62%)`);
    ctx.strokeStyle=g;ctx.shadowColor=`hsl(${h0},100%,62%)`;ctx.shadowBlur=16;
    ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.lineTo(e.x2,e.y2);ctx.stroke();
  });
  ctx.restore();
}

// ── slot overlay ───────────────────────────────────────────────────────────
function dSlot(){
  const n=Date.now(),ss=slotSt;
  ctx.fillStyle='rgba(5,5,18,.88)';ctx.fillRect(0,0,W,H);
  const PW=Math.min(W-28,305),PH=~~(H*.56),PX=(W-PW)/2,PY=(H-PH)/2;
  ctx.fillStyle='#08081e';ctx.shadowColor='#ffd700';ctx.shadowBlur=24;
  rr(PX,PY,PW,PH,10);ctx.fill();
  ctx.strokeStyle='#ffd700';ctx.lineWidth=2;rr(PX,PY,PW,PH,10);ctx.stroke();ctx.shadowBlur=0;

  ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=12;
  ctx.font=`bold ${~~(PW*.088)}px Share Tech Mono,Courier New`;
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText('🎰  GAMBLE  🎰',W/2,PY+PH*.07);ctx.shadowBlur=0;

  const rw=~~(PW*.22),rh=~~(PH*.40),ry=PY+PH*.23;
  const gap=~~((PW-rw*3)/4),sz=~~(rh*.54);
  for(let i=0;i<3;i++){
    const rx=PX+gap*(i+1)+rw*i,done=n>=ss.st[i];
    const si=done?ss.f[i]:~~(ss.sp[i])%6,col=SCOL[si];
    ctx.fillStyle='#060616';ctx.strokeStyle=done?col:'#222240';
    ctx.lineWidth=2;ctx.shadowColor=done?col:'transparent';ctx.shadowBlur=done?14:0;
    rr(rx,ry,rw,rh,5);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.save();ctx.beginPath();rr(rx,ry,rw,rh,5);ctx.clip();
    if(!done){
      const off=(ss.sp[i]%1)*rh;
      for(let j=-1;j<=1;j++){
        const sym=SSYM[(~~(ss.sp[i])+j+60)%6],sc=SCOL[(~~(ss.sp[i])+j+60)%6];
        ctx.fillStyle=sc;ctx.globalAlpha=1-Math.abs(j)*.55;
        ctx.font=`bold ${sz}px Share Tech Mono,Courier New`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(sym,rx+rw/2,ry+rh/2+j*rh-off);
      }
      ctx.globalAlpha=1;
    }else{
      ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=20;
      ctx.font=`bold ${sz}px Share Tech Mono,Courier New`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(SSYM[si],rx+rw/2,ry+rh/2);ctx.shadowBlur=0;
    }
    ctx.restore();
    ctx.fillStyle=done?col:'#2a2a4a';ctx.shadowColor=done?col:'transparent';ctx.shadowBlur=done?5:0;
    ctx.font=`${~~(PW*.036)}px Share Tech Mono,Courier New`;ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(done?'STOP':'...',rx+rw/2,ry+rh+5);ctx.shadowBlur=0;
  }

  if(ss.res&&ss.rAt){
    const fl=Math.sin((n-ss.rAt)/100)>0;
    let rt,rc;
    if(ss.res==='jackpot'){rt='JACKPOT!  ×3';rc=fl?'#ffd700':'#ff6b35';}
    else if(ss.res==='win'){rt='WINNER!  ×2';rc=fl?'#39ff14':'#00d4ff';}
    else{rt='BUSTED!  ÷2';rc=fl?'#ff2a6d':'#a855f7';}
    ctx.fillStyle=rc;ctx.shadowColor=rc;ctx.shadowBlur=18;
    ctx.font=`bold ${~~(PW*.096)}px Share Tech Mono,Courier New`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(rt,W/2,PY+PH*.83);ctx.shadowBlur=0;
    const left=Math.max(0,Math.ceil((ss.rAt+2800-n)/1000));
    ctx.fillStyle='#2a2a4a';ctx.font=`${~~(PW*.036)}px Share Tech Mono,Courier New`;
    ctx.textBaseline='bottom';ctx.fillText(`resuming in ${left}s`,W/2,PY+PH-6);
  }else if(!ss.res){
    ctx.fillStyle='#2a2a4a';ctx.font=`${~~(PW*.044)}px Share Tech Mono,Courier New`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SPINNING...',W/2,PY+PH*.85);
  }
}

function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

// ── input ──────────────────────────────────────────────────────────────────
const DM={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},
  ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},
  ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},
  ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0}};

document.addEventListener('keydown',e=>{
  if(state===S.GAMBLING)return;
  if(e.key===' '||e.key==='p'||e.key==='P'){
    e.preventDefault();
    if(state===S.PLAYING)      pauseG();
    else if(state===S.PAUSED)  resumeG();
    else if(state===S.MENU||state===S.OVER)startGame();
    return;
  }
  if(e.key==='Enter'&&(state===S.MENU||state===S.OVER)){startGame();return;}
  const d=DM[e.key];if(!d)return;
  e.preventDefault();
  if(state===S.MENU||state===S.OVER){startGame();return;}
  if(state!==S.PLAYING)return;
  if(d.x!==-dir.x||d.y!==-dir.y)ndir=d;
});

let tx=0,ty=0;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(state===S.GAMBLING)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){
    if(state===S.PLAYING)pauseG();else if(state===S.PAUSED)resumeG();return;
  }
  const d=Math.abs(dx)>Math.abs(dy)?(dx>0?DM.ArrowRight:DM.ArrowLeft):(dy>0?DM.ArrowDown:DM.ArrowUp);
  if(state===S.MENU||state===S.OVER){ndir=d;startGame();return;}
  if(state!==S.PLAYING)return;
  if(d.x!==-dir.x||d.y!==-dir.y)ndir=d;
},{passive:true});

$pbtn.addEventListener('click',startGame);

// ── transitions ────────────────────────────────────────────────────────────
function startGame(){
  init();state=S.PLAYING;
  $ov.classList.add('off');$sg.classList.remove('on');
  $sub.textContent='How long can you get?';$pbtn.textContent='Play';
  sfx.pip(880,.06);
}
function pauseG() {state=S.PAUSED;$pov.classList.add('on');sfx.pause();}
function resumeG(){state=S.PLAYING;$pov.classList.remove('on');sfx.unpause();lastAt=performance.now();}

// ── boot ───────────────────────────────────────────────────────────────────
parts=[];pops=[];ripples=[];
initMenu();
</script>
